#
# Changes to this file will be overwritten by `trmnlp pull`.
#
# Docs: https://help.usetrmnl.com/en/articles/10542599-importing-and-exporting-private-plugins#h_581fb988f0
#
---
description: Barcelona metro status and alerts
strategy: polling
framework_version: '3.3.1'
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
polling_url: 'https://api.tmb.cat/v1/alerts/metro/channels/WEB?app_id={{ userAppId | default: "4c132798" }}&app_key={{ userAppKey | default: "a828910cef5a0376607986191db19d14" }}'
polling_headers: ''
polling_body: ''
icon: media/icon.svg
name: TMB Metro Alerts
refresh_interval: 30
custom_fields:
- keyname: userAppId
  field_type: string
  name: App ID
  optional: true
  description: Optional. Leave blank to use TMB's public website credentials.
  help_text: Register for free at the <a href="https://developer.tmb.cat/docs/getting-started">developer site</a>.
- keyname: userAppKey
  field_type: string
  name: App Key
  optional: true
  description: Optional. Leave blank to use TMB's public website credentials.
  help_text: Retrieve your app_id and app_key from the dashboard after signing up.
- keyname: userLanguage
  field_type: select
  name: Language
  description: Display language for alert text and labels.
  help_text: TMB publishes alerts in Catalan, Spanish and English.
  options:
  - English
  - Spanish
  - Catalan
  default: English
- keyname: author_bio
  field_type: author_bio
  name: About This Plugin
  description: >-
    Check Barcelona Metro service notices at a glance on your TRMNL. TMB Metro Alerts shows
    circulation disruptions and station-related notices, grouped by metro line and prioritized
    to make significant issues easier to spot. When no issues are reported, the screen shows a
    normal-service state instead of looking empty. <br/><br/> Choose English, Spanish or
    Catalan for labels and available notice text. The full layout includes a QR code linking
    to TMB's live status page so you can read further details before travelling. <br/><br/>
    The plugin refreshes from TMB's public alerts feed every 30 minutes. It works without
    entering credentials by default, while allowing you to provide your own TMB API
    credentials if preferred. Built for Barcelona commuters by Ivan Perez.
  category: "news,travel"
  learn_more_url: https://github.com/taichikuji/trmnl-tmb-plugin/tree/main/TRMNL#setup
  github_url: "https://github.com/taichikuji/trmnl-tmb-plugin"
